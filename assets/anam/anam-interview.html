<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anam AI Interview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0A1224; }
      body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
      video { width: 100%; height: 100%; object-fit: cover; background: #15203B; }
      #status { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 8px 10px;
        border-radius: 8px; color: #FFFFFF; background: rgba(15, 23, 42, 0.72);
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </head>
  <body>
    <video id="persona-video" autoplay playsinline></video>
    <div id="status">Loading...</div>

    <script type="module">
      import { unsafe_createClientWithApiKey } from "https://esm.sh/@anam-ai/js-sdk@4.27.0";

      const PLACEHOLDER_API_KEY = "PLACEHOLDER_API_KEY";
      const videoElement = document.getElementById("persona-video");
      const statusElement = document.getElementById("status");
      const query = new URLSearchParams(window.location.search);
      let config = {
        apiKey: query.get("apiKey") || PLACEHOLDER_API_KEY,
        personaConfig: {},
      };
      let client;

      function sendStatus(status, message) {
        statusElement.textContent = message || status;
        window.ReactNativeWebView?.postMessage(JSON.stringify({ status, message }));
      }

      function describeError(error) {
        if (!error) return "Unknown error";
        const name = error.name || "Error";
        const message = error.message || String(error);
        const cause = error.cause ? ` Cause: ${error.cause.message || error.cause}` : "";
        return `${name}: ${message}${cause}`;
      }

      function logError(context, error) {
        const detail = `${context} - ${describeError(error)}`;
        console.error(detail, error);
        sendStatus("error", detail);
      }

      function readMessage(event) {
        try {
          const nextConfig = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
          if (nextConfig && typeof nextConfig === "object") {
            config = { ...config, ...nextConfig };
            startSession();
          }
        } catch (error) {
          sendStatus("error", "Invalid session configuration.");
          console.error("Invalid Anam session configuration", error);
        }
      }

      function ensureMediaDevices() {
        if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
          sendStatus(
            "error",
            "Camera and microphone are unavailable. This bundled file is not a secure WebView context. Use an HTTPS URL or a local HTTP server."
          );
          return false;
        }
        return true;
      }

      async function startSession() {
        if (client) return;
        if (!config.apiKey || config.apiKey === PLACEHOLDER_API_KEY) {
          sendStatus("error", "Set EXPO_PUBLIC_ANAM_API_KEY to test the Anam session.");
          return;
        }
        try {
          sendStatus("loading", "Connecting...");
          if (!ensureMediaDevices()) return;
          const mediaConstraints = {
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
            video: true,
          };
          const permissionStream = await navigator.mediaDevices.getUserMedia(mediaConstraints);
          console.log("Microphone/camera preflight succeeded", {
            audioTracks: permissionStream.getAudioTracks().map((track) => track.getSettings()),
            videoTracks: permissionStream.getVideoTracks().map((track) => track.getSettings()),
          });
          // The SDK opens its own input stream. Release the preflight stream first
          // so Android does not reject the SDK's second microphone request.
          permissionStream.getTracks().forEach((track) => track.stop());
          client = unsafe_createClientWithApiKey(config.apiKey, config.personaConfig || {});
          await client.streamToVideoElement("persona-video");
          sendStatus("connected", "Connected");
        } catch (error) {
          client = undefined;
          logError("Failed to start Anam session", error);
        }
      }

      window.addEventListener("message", readMessage);
      document.addEventListener("message", readMessage);
      window.addEventListener("beforeunload", () => sendStatus("disconnected", "Disconnected"));
      sendStatus("loading", "Waiting for session configuration...");
      startSession();
    </script>
  </body>
</html>
